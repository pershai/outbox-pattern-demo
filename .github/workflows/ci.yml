name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install parent POM
        run: mvn -N install



      - name: Build outbox-commons
        run: mvn clean install -pl outbox-commons -DskipTests

      - name: Build all services
        run: mvn clean compile -pl order-service,stock-service,billing-service

      - name: Run tests
        run: mvn test -pl order-service,stock-service,billing-service
        continue-on-error: true
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres

      - name: Package applications
        run: mvn package -DskipTests

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            order-service/target/*.jar
            stock-service/target/*.jar
            billing-service/target/*.jar
          retention-days: 7

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven verify
        run: mvn verify -DskipTests

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install parent POM
        run: mvn -N install

      - name: Build outbox-commons
        run: mvn clean install -pl outbox-commons -DskipTests

      - name: Package all services
        run: mvn package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for order-service
        id: meta-order
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/order-service
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push order-service
        uses: docker/build-push-action@v5
        with:
          context: ./order-service
          push: true
          tags: ${{ steps.meta-order.outputs.tags }}
          labels: ${{ steps.meta-order.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for stock-service
        id: meta-stock
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/stock-service
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push stock-service
        uses: docker/build-push-action@v5
        with:
          context: ./stock-service
          push: true
          tags: ${{ steps.meta-stock.outputs.tags }}
          labels: ${{ steps.meta-stock.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for billing-service
        id: meta-billing
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/billing-service
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push billing-service
        uses: docker/build-push-action@v5
        with:
          context: ./billing-service
          push: true
          tags: ${{ steps.meta-billing.outputs.tags }}
          labels: ${{ steps.meta-billing.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
