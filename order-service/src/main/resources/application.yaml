server:
  port: 8080

spring:
  datasource:
    url: ${ORDERSERVICE_DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${ORDERSERVICE_DB_USER:orders}
    password: ${ORDERSERVICE_DB_PASSWORD:orders}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        spring.json.add.type.headers: false

app:
  kafka:
    topics:
      orders-created: orders.created.v1
  outbox:
    relay-interval: PT2S
  retry:
    backoff:
      initial-interval: 500
      multiplier: 2.0
      max-interval: 10000
    max-attempts: 5

logging:
  level:
    com.softteco.orderservice: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
